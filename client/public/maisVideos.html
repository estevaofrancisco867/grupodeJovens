<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vídeos da Paróquia</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #1f2937;
    }

    section {
      padding: 80px 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .titulo {
      text-align: center;
      margin-bottom: 50px;
    }

    .titulo h2 {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .linha {
      width: 90px;
      height: 4px;
      background: #2563eb;
      margin: auto;
      border-radius: 10px;
    }

    .titulo p {
      color: #6b7280;
      margin-top: 18px;
      font-size: 1.1rem;
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 35px;
    }

    .video-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      transition: .3s;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
    }

    .video-card iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
    }

    .conteudo {
      padding: 24px;
    }

    .conteudo h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .conteudo p {
      color: #6b7280;
      line-height: 1.6;
    }

    .ver-mais {
      text-align: center;
      margin-top: 45px;
    }

    .ver-mais a {
      text-decoration: none;
      color: #2563eb;
      font-size: 1.4rem;
      font-weight: 600;
      transition: .3s;
    }

    .ver-mais a:hover {
      opacity: .8;
    }

    @media (max-width: 600px) {
      .videos-grid {
        grid-template-columns: 1fr;
      }

      .titulo h2 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

<section id="videos">
  <div class="container">

    <div class="titulo">
      <h2>Nossos Vídeos</h2>
      <div class="linha"></div>

      <p>
        Assista aos vídeos e acompanhe conteúdos especiais da Paróquia.
      </p>
    </div>

    <div class="videos-grid">

      <!-- vídeo 1 -->
      <div class="video-card">
        <iframe
          src="https://www.youtube.com/embed/kvvQFhsk-ak"
          title="O sétimo mandamento"
          allowfullscreen>
        </iframe>

        <div class="conteudo">
          <h3>O sétimo mandamento</h3>

          <p>
            Conheça o que é o adultério para igreja.
          </p>
        </div>
      </div>

      <!-- vídeo 2 -->
      <div class="video-card">
        <iframe
          src="https://www.youtube.com/embed/PuTjzlNZ34Y"
          title="Mensagem Especial"
          allowfullscreen>
        </iframe>

        <div class="conteudo">
          <h3>Mensagem Especial</h3>

          <p>
            A declaração de Jesus Cristo no livro de João.
          </p>
        </div>
      </div>

    </div>

    <div class="ver-mais">
      <a href="https://www.youtube.com/" target="_blank">
        Ver mais vídeos →
      </a>
    </div>

  </div>
</section>

</body>
</html>
